name: Build iKuai Q3000 OpenWrt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/openwrt-builder.yml'
      - 'config.seed'
      - 'dts/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_REF: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            libelf-dev device-tree-compiler qemu-utils zstd ccache
          sudo apt-get clean

      - name: Clone latest OpenWrt 25.12 stable branch
        run: |
          git clone --depth 1 --branch "$OPENWRT_REF" "$OPENWRT_REPO" openwrt
          cd openwrt
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Apply iKuai Q3000 support
        run: |
          chmod +x scripts/prepare-q3000.sh
          ./scripts/prepare-q3000.sh "$GITHUB_WORKSPACE/openwrt"
          grep -n "define Device/ikuai_q3000" openwrt/target/linux/mediatek/image/filogic.mk
          grep -n "ikuai,q3000" openwrt/target/linux/mediatek/filogic/base-files/etc/board.d/02_network

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Q3000 target
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/config.seed" .config
          make defconfig
          grep -E '^CONFIG_TARGET_mediatek|^CONFIG_TARGET_ROOTFS_(SQUASHFS|INITRAMFS)|^CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)" || make download -j1 V=s
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect Q3000 images
        run: |
          set -euo pipefail
          mkdir -p firmware
          shopt -s nullglob
          images=(openwrt/bin/targets/mediatek/filogic/*ikuai_q3000*)
          if (( ${#images[@]} == 0 )); then
            echo "No Q3000 firmware images were generated" >&2
            find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          cp -v "${images[@]}" firmware/
          cp -v openwrt/bin/targets/mediatek/filogic/sha256sums firmware/ 2>/dev/null || true
          {
            echo "OpenWrt source: $OPENWRT_REPO"
            echo "OpenWrt ref: $OPENWRT_REF"
            echo "OpenWrt commit: $OPENWRT_COMMIT"
            echo "Build time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > firmware/BUILD_INFO.txt
          ls -lh firmware

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikuai-q3000-openwrt-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
